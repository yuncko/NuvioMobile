name: Build Android APK on release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag to build or rebuild
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-apk-release-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build Android test APK
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Check out the release source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0

      - name: Validate release and read app version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_TAG}" ]]; then
            echo "No release tag was supplied." >&2
            exit 1
          fi
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null

          version="$(sed -nE 's/^[[:space:]]*MARKETING_VERSION[[:space:]]*=[[:space:]]*([^[:space:]#]+).*$/\1/p' iosApp/Configuration/Version.xcconfig | head -n 1)"
          if [[ -z "${version}" ]]; then
            echo "MARKETING_VERSION is missing from Version.xcconfig." >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          {
            echo "## Android test APK build"
            echo
            echo "- Release tag: \`${RELEASE_TAG}\`"
            echo "- App version: \`${version}\`"
            echo "- Variant: \`fullDebug\` (debug-signed)"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure Android SDK properties
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk_root}" ]]; then
            echo "Android SDK path is unavailable on this runner." >&2
            exit 1
          fi
          printf 'sdk.dir=%s\nNUVIO_ANDROID_DISTRIBUTION=full\n' "${sdk_root}" > local.properties

      - name: Build full-debug APK
        env:
          APP_VERSION: ${{ steps.release.outputs.version }}
        run: ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full -Pnuvio.app.versionName="${APP_VERSION}" --stacktrace

      - name: Verify APK signature and create checksum
        shell: bash
        env:
          APP_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          source_apk="androidApp/build/outputs/apk/full/debug/androidApp-full-debug.apk"
          if [[ ! -s "${source_apk}" ]]; then
            echo "Expected full-debug APK was not produced: ${source_apk}" >&2
            exit 1
          fi

          mkdir -p release-assets
          apk="release-assets/Hearbor-${APP_VERSION}-full-debug.apk"
          cp "${source_apk}" "${apk}"

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          build_tools="$(find "${sdk_root}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          if [[ -z "${build_tools}" || ! -x "${build_tools}/apksigner" ]]; then
            echo "Android apksigner was not found in the installed build-tools." >&2
            exit 1
          fi
          "${build_tools}/apksigner" verify --verbose "${apk}"
          sha256sum "${apk}" > release-assets/SHA256SUMS.txt

          {
            echo
            echo "### Generated test APK"
            echo "- \`$(basename "${apk}")\` (package \`com.nuviodebug.com\`, version \`${APP_VERSION}\`)"
            echo "- Signed with the runner's debug key; this is not a production update package."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Attach APK and checksum to the GitHub release
        run: |
          gh release upload "${RELEASE_TAG}" \
            "release-assets/Hearbor-${{ steps.release.outputs.version }}-full-debug.apk" \
            release-assets/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
